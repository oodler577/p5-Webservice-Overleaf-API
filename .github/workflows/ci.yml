name: CI

on:
  push:
  pull_request:

jobs:
  runtime-tests:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.10'
          - '5.20'
          - '5.30'
          - '5.40'
          - '5.44'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install runtime and test dependencies
        run: >-
          cpanm --notest
          Dispatch::Fu Util::H2O::More
          HTTP::Tiny JSON::PP URI::Escape MIME::Base64 HTML::Entities Pod::Usage
          Test::More File::Temp File::Spec

      - name: Run tests
        run: prove -lr t
