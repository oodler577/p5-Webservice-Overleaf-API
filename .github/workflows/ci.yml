name: CI

on:
  push:
  pull_request:

jobs:
  runtime-tests:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.10'
          - '5.20'
          - '5.30'
          - '5.40'
          - '5.44'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install runtime and test dependencies
        run: >-
          cpanm --notest
          Dispatch::Fu Util::H2O::More
          HTTP::Tiny JSON::PP URI::Escape MIME::Base64 HTML::Entities
          Test::More File::Temp File::Spec

      - name: Run tests
        run: prove -lr t

  coverage:
    name: Full coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44'

      - name: Install dependencies and coverage tools
        run: >-
          cpanm --notest
          Dispatch::Fu Util::H2O::More
          HTTP::Tiny JSON::PP URI::Escape MIME::Base64 HTML::Entities
          Test::More File::Temp File::Spec
          Devel::Cover Pod::Coverage

      - name: Collect coverage
        shell: bash
        run: |
          set -euo pipefail
          cover -delete
          HARNESS_PERL_SWITCHES='-MDevel::Cover=-coverage,statement,branch,condition,subroutine,pod' prove -lr t

      - name: Report and enforce 100 percent coverage
        shell: bash
        run: |
          set -euo pipefail

          perl -MDevel::Cover::DB -e '
            use strict;
            use warnings;

            my $db = Devel::Cover::DB->new(db => "cover_db");
            $db->merge_runs;

            my @files = grep {
                m{(?:^|/)lib/Webservice/Overleaf/API[.]pm\z}
            } $db->cover->items;

            die "Coverage gate failed: could not uniquely locate lib/Webservice/Overleaf/API.pm in cover_db\n"
                unless @files == 1;

            my $file = $files[0];
            my @criteria = qw(
                statement
                branch
                condition
                subroutine
                pod
            );

            $db->calculate_summary(files => [$file]);
            $db->print_summary([$file], \@criteria);

            for my $criterion (@criteria) {
                my $percentage = $db->summary($file, $criterion, "percentage");

                die "Coverage gate failed: no $criterion coverage data for $file\n"
                    unless defined $percentage;

                printf "%-10s %6.2f%%\n", $criterion, $percentage;

                die sprintf(
                    "Coverage gate failed: %s coverage is %.2f%%, expected 100%%\n",
                    $criterion,
                    $percentage,
                ) if $percentage < 100;
            }

            print "Coverage gate passed: statement, branch, condition, subroutine, and POD are fully covered.\n";
          '
